name: Device SDK Verification

on:
  pull_request:
    paths:
      - "device_sdk/**"
      - "scripts/verify_device_sdk.sh"
      - "scripts/verify_device_sdk_bootstrap.sh"
      - "scripts/generate_mqtt_tls_certs.sh"
      - "docker-compose.yml"
      - ".github/workflows/device-sdk-verification.yml"
  workflow_dispatch:

concurrency:
  group: device-sdk-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-device-sdk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate baseline certificates
        run: |
          chmod +x scripts/generate_mqtt_tls_certs.sh
          scripts/generate_mqtt_tls_certs.sh

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for MQTT broker
        run: |
          for i in {1..30}; do
            if (echo > /dev/tcp/localhost/8883) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "MQTT broker did not become reachable in time"
          docker compose logs --no-color
          exit 1

      - name: Run Device SDK verification
        run: |
          chmod +x scripts/verify_device_sdk.sh
          chmod +x scripts/verify_device_sdk_unit.sh
          chmod +x scripts/verify_device_sdk_bootstrap.sh
          chmod +x scripts/verify_device_sdk_mqtt_integration.sh
          scripts/verify_device_sdk.sh
          scripts/verify_device_sdk_unit.sh
          scripts/verify_device_sdk_bootstrap.sh
          REQUIRE_DEVICE_SDK_MQTT_INTEGRATION=1 scripts/verify_device_sdk_mqtt_integration.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
