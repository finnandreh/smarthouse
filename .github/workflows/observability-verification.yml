name: Observability Verification

on:
  pull_request:
    paths:
      - "monitoring/**"
      - "scripts/verify_observability.sh"
      - "docker-compose.yml"
      - ".github/workflows/observability-verification.yml"
  workflow_dispatch:

concurrency:
  group: observability-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-observability:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for observability API
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8094/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Observability API did not become healthy in time"
          docker compose logs --no-color
          exit 1

      - name: Run observability verification
        run: |
          chmod +x scripts/verify_observability.sh
          scripts/verify_observability.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
