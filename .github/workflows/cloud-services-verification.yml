name: Cloud Services Verification

on:
  pull_request:
    paths:
      - "cloud_services/**"
      - "scripts/verify_cloud_services.sh"
      - "docker-compose.yml"
      - ".github/workflows/cloud-services-verification.yml"
  workflow_dispatch:

concurrency:
  group: cloud-services-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-cloud-services:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for cloud-services
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8087/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Cloud services did not become healthy in time"
          docker compose logs --no-color
          exit 1

      - name: Run cloud-services verification
        run: |
          chmod +x scripts/verify_cloud_services.sh
          scripts/verify_cloud_services.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
