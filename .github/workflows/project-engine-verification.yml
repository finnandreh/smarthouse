name: Project Engine Verification

on:
  pull_request:
    paths:
      - "services/project_engine/**"
      - "scripts/verify_project_engine.sh"
      - "docker-compose.yml"
      - ".github/workflows/project-engine-verification.yml"
  workflow_dispatch:

concurrency:
  group: project-engine-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-project-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for project-engine
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8085/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Project engine did not become healthy in time"
          docker compose logs --no-color
          exit 1

      - name: Run project-engine verification
        run: |
          chmod +x scripts/verify_project_engine.sh
          chmod +x scripts/verify_phase_scaffold_integrity.sh
          scripts/verify_project_engine.sh
          scripts/verify_phase_scaffold_integrity.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
