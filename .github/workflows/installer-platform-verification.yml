name: Installer Platform Verification

on:
  pull_request:
    paths:
      - "installer_platform/**"
      - "scripts/verify_installer_platform.sh"
      - "docker-compose.yml"
      - ".github/workflows/installer-platform-verification.yml"
  workflow_dispatch:

concurrency:
  group: installer-platform-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-installer-platform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for installer-platform
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8088/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Installer platform did not become healthy in time"
          docker compose logs --no-color
          exit 1

      - name: Run installer-platform verification
        run: |
          chmod +x scripts/verify_installer_platform.sh
          scripts/verify_installer_platform.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
