name: Edge Controller Verification

on:
  pull_request:
    paths:
      - "services/edge_controller/**"
      - "config/edge/**"
      - "scripts/verify_edge_controller.sh"
      - "scripts/verify_edge_maintenance_recovery.sh"
      - "db/init/001_init.sql"
      - "docker-compose.yml"
      - ".github/workflows/edge-controller-verification.yml"
  workflow_dispatch:

concurrency:
  group: edge-controller-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-edge-controller:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate baseline certificates
        run: |
          chmod +x scripts/generate_mqtt_tls_certs.sh
          scripts/generate_mqtt_tls_certs.sh

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for APIs
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8081/health >/dev/null && curl -fsS http://localhost:8082/health >/dev/null && curl -fsS http://localhost:8084/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Services did not become healthy in time"
          docker compose logs --no-color
          exit 1

      - name: Run edge verification
        run: |
          chmod +x scripts/verify_edge_controller.sh
          chmod +x scripts/verify_edge_maintenance_recovery.sh
          scripts/verify_edge_controller.sh
          scripts/verify_edge_maintenance_recovery.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
